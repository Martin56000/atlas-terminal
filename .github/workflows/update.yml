name: Update data and deploy

on:
  schedule:
    # every 15 min on weekdays, 06:00-17:59 UTC = covers 08:30-18:45 Paris in summer and winter.
    # The job itself decides what to fetch (pipeline/schedule.py); outside the windows it does nothing.
    - cron: "*/15 6-17 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Update everything now"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch for FinBERT)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Unit tests (Python)
        run: python -m pytest -q

      - name: Unit tests (site)
        run: node --test tests/js/site.test.js

      - name: Cache Hugging Face models (FinBERT + translation)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-finbert-opusmt-tcbig-v3

      - name: Restore previous data (branches "data" and "data-daily")
        run: |
          mkdir -p site/data
          for b in data data-daily; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              rm -rf "/tmp/$b"
              git clone --quiet --depth 1 --branch "$b" \
                "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "/tmp/$b"
              rm -rf "/tmp/$b/.git"
              cp -r "/tmp/$b/." site/data/
            fi
          done

      - name: Run update job
        id: pipeline
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          # a code push or a manual run with "force" refreshes everything; the schedule decides by itself
          FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
        run: |
          if [ "$FORCE" = "true" ]; then python -m pipeline.run --force; else python -m pipeline.run; fi

      # Heavy, slowly-changing files (5-year histories, company pages, ESEF, SEC) live in "data-daily",
      # pushed only after the 08:30 / 17:40 runs; everything else in "data", pushed every run.
      # Both are single-commit branches (force-pushed) so the repository does not grow.
      - name: Save data
        if: steps.pipeline.outputs.ran == 'true'
        env:
          HEAVY: ${{ steps.pipeline.outputs.heavy }}
        run: |
          push_dir () {
            (cd "$1" && git init -q -b "$2" && git add -A && \
             git -c user.name="atlas-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
               commit -q -m "$2 $(date -u +%Y-%m-%dT%H:%MZ)" && \
             git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$2")
          }
          rm -rf /tmp/out-light /tmp/out-heavy && mkdir -p /tmp/out-light /tmp/out-heavy
          cp -r site/data/. /tmp/out-light/
          for d in history company esef fundamentals; do
            rm -rf "/tmp/out-light/$d"
            if [ -d "site/data/$d" ]; then cp -r "site/data/$d" /tmp/out-heavy/; fi
          done
          push_dir /tmp/out-light data
          if [ "$HEAVY" = "true" ]; then push_dir /tmp/out-heavy data-daily; fi

      - name: Configure Pages
        if: steps.pipeline.outputs.ran == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        if: steps.pipeline.outputs.ran == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.pipeline.outputs.ran == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
