<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Terminal</title>
<meta name="description" content="Mini terminal financier : marchés US et Europe, fondamentaux SEC, risque, news et macro. Données réelles, différées.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M3 13 8 3l5 10' stroke='%23FFA028' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ATLAS<span>TERMINAL</span></div>
  <form class="cmd" id="cmdForm" autocomplete="off">
    <span class="cmd-prompt">&gt;</span>
    <input id="cmd" type="text" spellcheck="false" aria-label="Command" data-i18n-placeholder="cmd.placeholder"
      role="combobox" aria-autocomplete="list" aria-controls="cmdSugg" aria-expanded="false">
    <button type="submit" class="cmd-go">GO</button>
    <ul class="sugg" id="cmdSugg" role="listbox" hidden></ul>
  </form>
  <div class="clocks" id="clocks"></div>
  <button class="gear" id="gearBtn" aria-label="Settings" data-i18n-title="settings.title">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
  </button>
</header>
<div class="cmd-msg" id="cmdMsg" role="status" aria-live="polite"></div>
<nav class="tabs" id="tabs"></nav>
<main id="main" class="main"></main>
<footer class="foot"><span data-i18n="foot.disclaimer"></span></footer>

<div class="overlay" id="settings" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="dialog-head"><span id="settingsTitle" data-i18n="settings.title"></span><button class="x" data-close>&times;</button></div>
    <div class="dialog-body" id="settingsBody"></div>
  </div>
</div>
<div class="overlay" id="wlEditor" hidden>
  <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="wlTitle">
    <div class="dialog-head"><span id="wlTitle" data-i18n="wl.edit_title"></span><button class="x" data-close>&times;</button></div>
    <div class="dialog-body" id="wlBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
